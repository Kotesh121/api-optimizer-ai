name: Deploy API Optimizer AI

on:
  push:
    branches:
      - main

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Docker Compose
        run: |
          docker compose config

      - name: Build Docker images
        run: |
          docker compose build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/api_optimizer_key
          chmod 600 ~/.ssh/api_optimizer_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh \
            -i ~/.ssh/api_optimizer_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            cd /opt/api-optimizer-ai

            echo "Pulling latest source..."
            git fetch origin
            git reset --hard origin/main

            echo "Checking Docker..."
            docker --version
            docker compose version

            echo "Validating Compose..."
            docker compose config

            echo "Creating database backup..."
            mkdir -p /opt/api-optimizer-backups

            docker exec api_optimizer_db \
              mysqldump \
              -uapi_user \
              -p"${MYSQL_PASSWORD}" \
              api_optimizer_db \
              | gzip > \
[<32;7;3M              /opt/api-optimizer-backups/pre_deploy_$(date +%F_%H-%M-%S).sql.gz || true
[<32;7;4M
            echo "Building containers..."
            docker compose build

            echo "Starting containers..."
            docker compose up -d

            echo "Waiting for services..."
            sleep 20

[<32;8;4M            echo "Container status..."
            docker compose ps
[<32;9;4M
            echo "Backend health..."
            docker exec api_optimizer_backend \
              curl -f http://localhost:8000/health
[<32;10;4M
[<32;10;5M            echo "Frontend health..."
            curl -f http://localhost/health
[<32;11;5M
            echo "Deployment successful."

          EOF
